<ion-content class="modal-content">
  <div class="header">
    <ion-button fill="clear" (click)="dismiss()" aria-label="Cerrar detalle">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="image-wrapper">
    <img [src]="deal.thumb" alt="game cover" />
    <div class="overlay"></div>
    <span class="deal-chip">-{{ savings }}</span>
  </div>

  <div class="content">
    <h2>{{ deal.title }}</h2>

    <div class="store-row">
      <img *ngIf="storeLogo" [src]="storeLogo" alt="store logo" />
      <span>{{ storeName }}</span>
    </div>

    <div class="price-card">
      <div>
        <span class="label">Oferta</span>
        <strong>${{ deal.salePrice }}</strong>
      </div>
      <div>
        <span class="label">Antes</span>
        <span class="normal">${{ deal.normalPrice }}</span>
      </div>
    </div>

    <div class="score-grid">
      <div class="score-card">
        <ion-icon name="star"></ion-icon>
        <span class="score-value rating">{{ deal.dealRating }}</span>
        <span class="score-label">Deal rating</span>
      </div>

      <div class="score-card metacritic" [class.is-empty]="!hasMetacriticScore">
        <ion-icon name="game-controller"></ion-icon>
        <span class="score-value">{{ metacriticScore }}</span>
        <span class="score-label">Metacritic</span>
      </div>
    </div>

    <ion-button expand="block" color="primary" (click)="openDeal()">
      Ver oferta
      <ion-icon slot="end" name="open-outline"></ion-icon>
    </ion-button>
  </div>
</ion-content>
