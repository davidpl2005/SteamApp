<div class="card" (click)="cardClicked.emit(deal)">
  <div class="image">
    <img [src]="deal.thumb" alt="game" />
    <div class="overlay"></div>

    <span class="rating">
      <ion-icon name="star-outline"></ion-icon>
      {{ deal.dealRating }}
    </span>

    <button class="favorite-btn" (click)="onFavorite($event)" aria-label="Toggle favorite">
      <ion-icon [name]="isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
    </button>
  </div>

  <div class="content">
    <h3>{{ deal.title }}</h3>

    <div class="store-row">
      <img *ngIf="storeLogo" [src]="storeLogo" alt="store" />
      <p>{{ storeName }}</p>
    </div>

    <div class="prices">
      <span class="sale">${{ deal.salePrice }}</span>
      <span class="normal">${{ deal.normalPrice }}</span>
      <span class="discount">-{{ savings }}</span>
    </div>
  </div>
</div>
