<div class="game-card" [class.compact]="compact" (click)="onCardClick()">
  <!-- Savings Badge -->
  <div class="savings-badge">-{{ savingsPercent }}</div>

  <!-- Favorite Button -->
  <button class="fav-btn" (click)="onFavoriteClick($event)">
    <ion-icon [name]="isFav ? 'heart' : 'heart-outline'" [class.active]="isFav"></ion-icon>
  </button>

  <!-- Game Thumbnail -->
  <div class="card-img-wrapper">
    <img [src]="deal.thumb" [alt]="deal.title" class="card-img" loading="lazy" />
    <div class="img-overlay"></div>
  </div>

  <!-- Card Body -->
  <div class="card-body">
    <h3 class="game-title">{{ deal.title }}</h3>

    <!-- Store Info -->
    <div class="store-info" *ngIf="store">
      <img [src]="storeLogoUrl" [alt]="store.storeName" class="store-logo" />
      <span class="store-name">{{ store.storeName }}</span>
    </div>

    <!-- Pricing -->
    <div class="pricing">
      <span class="original-price">${{ deal.normalPrice }}</span>
      <span class="sale-price">${{ deal.salePrice }}</span>
    </div>

    <!-- Rating -->
    <div class="rating-row">
      <ion-icon name="star" class="star-icon"></ion-icon>
      <span class="rating-val">{{ dealRating }}</span>
      <span class="rating-label">Deal Rating</span>
    </div>
  </div>
</div>
