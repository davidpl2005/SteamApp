<ion-content class="deals-content">
  <div class="hero">
    <div>
      <span class="eyebrow">Steam Deals</span>
      <h1>Encuentra ofertas épicas</h1>
      <p>Busca juegos, compara precios y guarda tu favorito para el widget.</p>
    </div>
  </div>

  <div class="search-wrap">
    <app-input (searched)="onSearch($event)"></app-input>
  </div>

  <ng-container *ngIf="!isSearching">
    <div class="section-header">
      <div>
        <h2>Top ofertas</h2>
        <p>Promociones destacadas de hoy</p>
      </div>
      <ion-icon name="flame-outline"></ion-icon>
    </div>

    <div class="carousel" *ngIf="!isLoading; else skeletonCarousel">
      <div class="carousel-item" *ngFor="let deal of topDeals">
        <app-card
          [deal]="deal"
          [isFavorite]="isFavorite(deal)"
          (cardClicked)="openDetail($event)"
          (favoriteToggled)="toggleFavorite($event)">
        </app-card>
      </div>
    </div>

    <ng-template #skeletonCarousel>
      <div class="carousel">
        <div class="skeleton-card" *ngFor="let i of [1,2,3,4,5]">
          <ion-skeleton-text animated></ion-skeleton-text>
        </div>
      </div>
    </ng-template>
  </ng-container>

  <ng-container *ngIf="isSearching">
    <div class="section-header">
      <div>
        <h2>Resultados</h2>
        <p>Juegos encontrados para tu búsqueda</p>
      </div>
      <ion-icon name="search-outline"></ion-icon>
    </div>

    <ng-container *ngIf="!isLoading; else skeletonGrid">
      <ng-container *ngIf="searchResults.length > 0; else emptyState">
        <div class="grid">
          <div class="grid-item" *ngFor="let deal of searchResults">
            <app-card
              [deal]="deal"
              [isFavorite]="isFavorite(deal)"
              (cardClicked)="openDetail($event)"
              (favoriteToggled)="toggleFavorite($event)">
            </app-card>
          </div>
        </div>
      </ng-container>
    </ng-container>

    <ng-template #skeletonGrid>
      <div class="grid">
        <div class="skeleton-card" *ngFor="let i of [1,2,3,4]">
          <ion-skeleton-text animated></ion-skeleton-text>
        </div>
      </div>
    </ng-template>

    <ng-template #emptyState>
      <div class="empty-state">
        <ion-icon name="sad-outline"></ion-icon>
        <h3>No encontramos juegos</h3>
        <p>Intenta con otro nombre o una palabra más corta.</p>
      </div>
    </ng-template>
  </ng-container>
</ion-content>
