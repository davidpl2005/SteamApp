<ion-content class="favorite-content">

  <div class="hero">
    <div>
      <span class="eyebrow">Your Pick</span>
      <h1>Juego favorito</h1>
      <p>Este juego se muestra en tu widget Android.</p>
    </div>
  </div>

  <ng-container *ngIf="favorite; else emptyState">

    <div class="favorite-card">
      <div class="image-wrapper">
        <img [src]="favorite.thumb" alt="game" />
        <div class="overlay"></div>
      </div>

      <div class="content">
        <h2>{{ favorite.title }}</h2>
        <p class="store">{{ favorite.storeName }}</p>

        <div class="prices">
          <span class="sale">${{ favorite.salePrice }}</span>
          <span class="normal">${{ favorite.normalPrice }}</span>
          <span class="discount">-{{ favorite.savings | number:'1.0-0' }}%</span>
        </div>

        <ion-button expand="block" color="danger" (click)="removeFavorite()">
          Eliminar favorito
        </ion-button>
      </div>
    </div>

  </ng-container>

  <ng-template #emptyState>
    <div class="empty">
      <ion-icon name="heart-outline"></ion-icon>
      <h3>No tienes favorito</h3>
      <p>Ve a Deals y selecciona uno.</p>
    </div>
  </ng-template>

</ion-content>
